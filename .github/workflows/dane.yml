name: Dane OECD
on:
  schedule:
    - cron: '40 6 * * *'   # codziennie: nowy rok danych trafia na stronę w dniu publikacji przez OECD
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  dane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/fetch-stats.mjs
      # Push z GITHUB_TOKEN nie uruchamia innych workflow, więc wdrożenie wywołujemy jawnie.
      - name: Zapis i wdrożenie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/stats.json; then echo "Bez zmian."; exit 0; fi
          git config user.name "dane-oecd"; git config user.email "dane-oecd@users.noreply.github.com"
          git add src/data/stats.json
          git commit -m "Dane OECD: nowe wartości"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref main
