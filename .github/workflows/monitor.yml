name: Monitoring Sejmu i stawek
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/monitor.mjs
      # Zmiany idą jako PR do redakcji, nigdy prosto na stronę.
      - name: PR z nowymi zdarzeniami
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s monitor/nowe.md ]; then echo "Brak zmian."; exit 0; fi
          b="monitor/$(date +%F)"
          git config user.name "monitor"; git config user.email "monitor@users.noreply.github.com"
          git switch -c "$b"
          git add monitor
          git commit -m "Monitoring: nowe zdarzenia $(date +%F)"
          git push -u origin "$b"
          gh pr create --title "Monitoring: nowe zdarzenia $(date +%F)" --body-file monitor/nowe.md --base main
