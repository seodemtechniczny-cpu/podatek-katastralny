name: Newsy
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  newsy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/newsy.mjs
      # Push z GITHUB_TOKEN nie uruchamia innych workflow, więc wdrożenie wywołujemy jawnie.
      - name: Zapis i wdrożenie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/newsy.json; then echo "Bez zmian."; exit 0; fi
          git config user.name "newsy"; git config user.email "newsy@users.noreply.github.com"
          git add src/data/newsy.json
          git commit -m "Newsy: aktualizacja nagłówków"
          git push
          gh workflow run deploy.yml --ref main
